[workspace]
resolver = "2"
members = [
  "crates/yaak",
  "crates/yaak-commands",
  # Common/foundation crates
  "crates/common/yaak-database",
  "crates/common/yaak-rpc",
  "crates/common/yaak-rpc-schema",
  # Shared crates (no Tauri dependency)
  "crates/yaak-core",
  "crates/yaak-common",
  "crates/yaak-crypto",
  "crates/yaak-filter",
  "crates/yaak-git",
  "crates/yaak-grpc",
  "crates/yaak-http",
  "crates/yaak-lifecycle",
  "crates/yaak-mcp",
  "crates/yaak-models",
  "crates/yaak-plugins",
  "crates/yaak-sse",
  "crates/yaak-sync",
  "crates/yaak-templates",
  "crates/yaak-tls",
  "crates/yaak-ws",
  "crates/yaak-wasm",
  "crates/yaak-api",
  "crates/yaak-proxy",
  # Proxy-specific crates
  "crates-proxy/yaak-proxy-lib",
  # Server crates (the browser tier's hosted send executor)
  "crates-server/yaak-web",
  "crates-server/yaak-playground",
  # CLI crates
  "crates-cli/yaak-cli",
  # Tauri-specific crates
  "crates-tauri/yaak-app-client",
  "crates-tauri/yaak-app-proxy",
  "crates-tauri/yaak-fonts",
  "crates-tauri/yaak-license",
  "crates-tauri/yaak-mac-window",
  "crates-tauri/yaak-system-appearance",
  "crates-tauri/yaak-tauri-utils",
  "crates-tauri/yaak-window",
]

[workspace.dependencies]
chrono = "0.4.42"
hex = "0.4.3"
keyring = "3.6.3"
log = "0.4.29"
reqwest = { version = "0.13.5", default-features = false, features = [
  # reqwest 0.13 switched `default-tls` from native-tls to rustls; keep the
  # rest of the old default set and stay on native-tls.
  "charset",
  "http2",
  "system-proxy",
  "native-tls",
] }
rustls = { version = "0.23.34", default-features = false }
rustls-platform-verifier = "0.7.1"
schemars = { version = "0.8.22", features = ["chrono"] }
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "2.11.1", default-features = false, features = [
  "common-controls-v6",
  "compression",
  "dynamic-acl",
] }
tauri-plugin = "2.6.1"
tauri-plugin-dialog = { version = "2.7.1", default-features = false }
tauri-plugin-shell = "2.3.5"
thiserror = "2.0.17"
tokio = "1.48.0"
ts-rs = "11.1.0"

# Internal crates - common/foundation
yaak-database = { version = "0.*", path = "crates/common/yaak-database" }
yaak-rpc = { version = "0.*", path = "crates/common/yaak-rpc" }
yaak-rpc-schema = { version = "0.*", path = "crates/common/yaak-rpc-schema" }

# Internal crates - shared
yaak-core = { version = "0.*", path = "crates/yaak-core" }
yaak = { version = "0.*", path = "crates/yaak" }
yaak-commands = { version = "0.*", path = "crates/yaak-commands" }
yaak-common = { version = "0.*", path = "crates/yaak-common" }
yaak-crypto = { version = "0.*", path = "crates/yaak-crypto" }
yaak-filter = { version = "0.*", path = "crates/yaak-filter" }
yaak-git = { version = "0.*", path = "crates/yaak-git" }
yaak-grpc = { version = "0.*", path = "crates/yaak-grpc" }
yaak-http = { version = "0.*", path = "crates/yaak-http" }
yaak-lifecycle = { version = "0.*", path = "crates/yaak-lifecycle" }
yaak-mcp = { version = "0.*", path = "crates/yaak-mcp" }
yaak-models = { version = "0.*", path = "crates/yaak-models" }
yaak-plugins = { version = "0.*", path = "crates/yaak-plugins" }
yaak-sse = { version = "0.*", path = "crates/yaak-sse" }
yaak-sync = { version = "0.*", path = "crates/yaak-sync" }
yaak-templates = { version = "0.*", path = "crates/yaak-templates" }
yaak-tls = { version = "0.*", path = "crates/yaak-tls" }
yaak-ws = { version = "0.*", path = "crates/yaak-ws" }
yaak-api = { version = "0.*", path = "crates/yaak-api" }
yaak-proxy = { version = "0.*", path = "crates/yaak-proxy" }

# Internal crates - proxy
yaak-proxy-lib = { version = "0.*", path = "crates-proxy/yaak-proxy-lib" }

# Internal crates - Tauri-specific
yaak-fonts = { version = "0.*", path = "crates-tauri/yaak-fonts" }
yaak-license = { version = "0.*", path = "crates-tauri/yaak-license" }
yaak-mac-window = { version = "0.*", path = "crates-tauri/yaak-mac-window" }
yaak-system-appearance = { version = "0.*", path = "crates-tauri/yaak-system-appearance" }
yaak-tauri-utils = { version = "0.*", path = "crates-tauri/yaak-tauri-utils" }
yaak-window = { version = "0.*", path = "crates-tauri/yaak-window" }

[profile.release]
strip = false

[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "d9bc695c18d9a25baec21d8a5f36d72e3a14ee53" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "d9bc695c18d9a25baec21d8a5f36d72e3a14ee53" }
