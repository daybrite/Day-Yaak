name: day

# Builds the Day client under apps/yaak-day for every Day target it declares, runs its
# walkthrough with screenshots, and packs it, through the shared Day workflow
# (https://github.com/daybrite/actions). Yaak's own workflows are untouched.

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    paths:
      - "apps/yaak-day/**"
      - "crates/**"
      - ".github/workflows/day.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write # release-asset upload on tag builds
      pages: write    # the project website (apps/yaak-day/website) → GitHub Pages
      id-token: write # deploy-pages OIDC token
    secrets: inherit
    with:
      project-path: apps/yaak-day
      targets: macos-appkit, macos-gtk, macos-qt, linux-gtk, linux-qt, windows-winui, ios-uikit, android-mdc, harmony-arkui
      # Build against the tip of the day branch the app tracks, not the revision the committed
      # lock pins: a sample app exists to prove the current framework still builds it, and a
      # lock left at an older revision would silently stop testing day at all. The revision is
      # resolved once per run, so every leg compiles the same one. Refresh the lock locally
      # (`cargo update -p day`) when a new framework API lands, so a local build matches.
      update-day-deps: true
      scripts: dayscript/demo.yaml
      # Yaak's own crates are upstream code this fork does not maintain; the Day project
      # depends on them by path, so the formatting check names only its own package.
      preflight-exclude: crates
      # The example workspace is created on first launch, so the walkthrough has requests to
      # open without a network.
      launch-env: DAY_DATA_DIR=/tmp/yaak-day-ci
      tolerate-failures: true
