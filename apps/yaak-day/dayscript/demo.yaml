# The walkthrough (https://daybrite.dev/docs/dayscript): drives the running app by element id
# on any target, and doubles as its test. It sends nothing: the example workspace's requests
# point at a public demo API, and a CI leg should not depend on it.
#
#     day launch -t macos-appkit --script dayscript/demo.yaml
flow:
  # The nav host mounts on every platform; which chrome it wears depends on the window width.
  - wait_for: { id: nav }
  - wait_for: { id: request-list }
  - screenshot: workspace

  # Open the first request of the example workspace and read its editor back.
  - select: { id: request-list, index: 0 }
  - wait_idle: {}
  - wait_for: { id: url }
  - assert_visible: { id: method }
  - assert_visible: { id: send }
  - screenshot: request

  # The editor writes the store as the user types: rename, and the list row follows.
  - input: { id: name, text: "Renamed request" }
  - wait_idle: {}
  - assert_text: { id: name, text: "Renamed request" }
  - screenshot: renamed

  # A new request lands in the list and opens in the editor. New Request rides the list's own
  # chrome, so a phone goes back to the list first; a wide window has nothing to pop.
  - nav_back: {}
  - wait_idle: {}
  - toolbar: { item: tb-new }
  - wait_idle: {}
  - assert_text: { id: url, text: "" }
  - input: { id: url, text: "https://example.com/new" }
  - wait_idle: {}
  - screenshot: new-request

  # A JSON body in the styled editor: typed text reaches the store, and the highlighter restyles
  # it in place (the caret stays where the typing left it).
  - select: { id: body-kind, index: 1 }
  - wait_idle: {}
  - wait_for: { id: body }
  # Code mode: Tab indents instead of leaving the editor. On the empty body the caret can only
  # be at the start, so the result is the same two spaces on every toolkit.
  - key: { id: body, key: Tab }
  - wait_idle: {}
  - assert_text: { id: body, text: "  " }
  - input: { id: body, text: "{\"name\": \"${[ user ]}\", \"count\": 3, \"ok\": true}" }
  - wait_idle: {}
  - assert_text: { id: body, text: "{\"name\": \"${[ user ]}\", \"count\": 3, \"ok\": true}" }
  - screenshot: body-json

  # Choosing a body kind is the user saying what the request carries, so the editor gives it
  # a method with a body and the matching Content-Type header, as Yaak's does.
  - assert_text: { id: method, text: "POST" }
  - select: { id: request-tab, index: 2 }
  - wait_for: { id: add-header }
  - assert_text: { id: "header-name:1", text: "Content-Type" }
  - assert_text: { id: "header-value:1", text: "application/json" }
  - tap: { id: add-header }
  - wait_for: { id: "header-name:2" }
  - input: { id: "header-name:2", text: "X-Trace" }
  - input: { id: "header-value:2", text: "${[ trace_id ]}" }
  - wait_idle: {}
  - screenshot: headers
  # A row removed while its field still holds the last edit.
  - tap: { id: "header-remove:2" }
  - wait_idle: {}
  - assert_missing: { id: "header-name:2" }

  # URL parameters: a query pair and a value for a path placeholder.
  - select: { id: request-tab, index: 1 }
  - wait_for: { id: add-param }
  - tap: { id: add-param }
  - wait_for: { id: "param-name:1" }
  - input: { id: "param-name:1", text: "page" }
  - input: { id: "param-value:1", text: "2" }
  - wait_idle: {}
  - screenshot: params

  # The other body kinds: a form's fields, and a GraphQL query with its variables.
  - select: { id: request-tab, index: 0 }
  - wait_for: { id: body-kind }
  - select: { id: body-kind, index: 5 }
  - wait_for: { id: add-field }
  - tap: { id: add-field }
  - wait_for: { id: "form-name:1" }
  - input: { id: "form-name:1", text: "title" }
  - input: { id: "form-value:1", text: "Hello" }
  - wait_idle: {}
  - screenshot: body-multipart
  - select: { id: body-kind, index: 6 }
  - wait_for: { id: graphql-query }
  - input: { id: graphql-query, text: "query { viewer { login } }" }
  - wait_idle: {}
  - screenshot: body-graphql

  # Authentication this client applies itself: Basic, Bearer and an API key.
  - select: { id: request-tab, index: 3 }
  - wait_for: { id: auth-kind }
  - select: { id: auth-kind, index: 3 }
  - wait_for: { id: auth-token }
  - assert_text: { id: auth-prefix, text: "Bearer" }
  - input: { id: auth-token, text: "${[ token ]}" }
  - toggle: { id: auth-show, value: true }
  - wait_idle: {}
  - screenshot: auth-bearer
  - select: { id: auth-kind, index: 4 }
  - wait_for: { id: auth-location }
  - screenshot: auth-api-key
  - select: { id: auth-kind, index: 3 }
  - wait_idle: {}

  # What the request overrides of its folder's and workspace's send settings.
  - select: { id: request-tab, index: 4 }
  - wait_for: { id: set-redirects }
  - select: { id: set-redirects, index: 2 }
  - input: { id: set-timeout, text: "5000" }
  - wait_idle: {}
  - screenshot: settings
  - select: { id: request-tab, index: 0 }
  - wait_idle: {}

  # The layout button stacks the response under the request and back. Only the wide editor
  # has the split; on a phone the button is there but the picker's one-pane layout stays.
  - toolbar: { item: tb-layout }
  - wait_idle: {}
  - screenshot: stacked
  - toolbar: { item: tb-layout }
  - wait_idle: {}

  # The same host re-presented at a phone's width: the editor is a pushed layer with a
  # request/response picker.
  - size_class: { width: compact }
  - wait_idle: {}
  - screenshot: compact
  # At that width a header's name and value take a line each.
  - select: { id: request-tab, index: 2 }
  - wait_for: { id: add-header }
  - screenshot: compact-headers
  - select: { id: request-tab, index: 0 }
  - wait_idle: {}
  - size_class: { width: auto }
  - wait_idle: {}
