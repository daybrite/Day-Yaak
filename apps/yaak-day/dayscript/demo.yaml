# The walkthrough (https://daybrite.dev/docs/how-to/dayscript): drives the running app by element id
# on any target, and doubles as its test. It sends nothing: the example workspace's requests
# point at a public demo API, and a CI leg should not depend on it.
#
#     day launch -t macos-appkit --script dayscript/demo.yaml
flow:
  # The nav host mounts on every platform; which chrome it wears depends on the window width.
  - wait_for: { id: nav }
  - wait_for: { id: request_list }
  - screenshot: workspace

  # Open the first request of the example workspace and read its editor back.
  - select: { id: request_list, index: 0 }
  - wait_idle: {}
  - wait_for: { id: url }
  - assert_visible: { id: method }
  - assert_visible: { id: send }
  - screenshot: request

  # The editor writes the store as the user types: rename, and the list row follows.
  - input: { id: name, text: "Renamed request" }
  - wait_idle: {}
  - assert_text: { id: name, text: "Renamed request" }
  - screenshot: renamed

  # A new request lands in the list and opens in the editor. New Request rides the list's own
  # chrome, so a phone goes back to the list first; a wide window has nothing to pop.
  - nav_back: {}
  - wait_idle: {}
  - toolbar: { item: tb_new }
  - wait_idle: {}
  - assert_text: { id: url, text: "" }
  - input: { id: url, text: "https://example.com/new" }
  - wait_idle: {}
  - screenshot: new-request

  # A JSON body in the styled editor: typed text reaches the store, and the highlighter restyles
  # it in place (the caret stays where the typing left it).
  - select: { id: body_kind, index: 1 }
  - wait_idle: {}
  - wait_for: { id: body }
  # Code mode: Tab indents instead of leaving the editor. On the empty body the caret can only
  # be at the start, so the result is the same two spaces on every toolkit.
  - key: { id: body, key: Tab }
  - wait_idle: {}
  - assert_text: { id: body, text: "  " }
  - input: { id: body, text: "{\"name\": \"${[ user ]}\", \"count\": 3, \"ok\": true}" }
  - wait_idle: {}
  - assert_text: { id: body, text: "{\"name\": \"${[ user ]}\", \"count\": 3, \"ok\": true}" }
  - screenshot: body-json

  # Choosing a body kind is the user saying what the request carries, so the editor gives it
  # a method with a body and the matching Content-Type header, as Yaak's does.
  - assert_text: { id: method, text: "POST" }
  - select: { id: request_tab, index: 2 }
  - wait_for: { id: add_header }
  - assert_text: { id: "header_name:1", text: "Content-Type" }
  - assert_text: { id: "header_value:1", text: "application/json" }
  - tap: { id: add_header }
  - wait_for: { id: "header_name:2" }
  - input: { id: "header_name:2", text: "X-Trace" }
  - input: { id: "header_value:2", text: "${[ trace_id ]}" }
  - wait_idle: {}
  - screenshot: headers
  # A row removed while its field still holds the last edit.
  - tap: { id: "header_remove:2" }
  - wait_idle: {}
  - assert_missing: { id: "header_name:2" }

  # URL parameters: a query pair and a value for a path placeholder.
  - select: { id: request_tab, index: 1 }
  - wait_for: { id: add_param }
  - tap: { id: add_param }
  - wait_for: { id: "param_name:1" }
  - input: { id: "param_name:1", text: "page" }
  - input: { id: "param_value:1", text: "2" }
  - wait_idle: {}
  - screenshot: params

  # The other body kinds: a form's fields, and a GraphQL query with its variables.
  - select: { id: request_tab, index: 0 }
  - wait_for: { id: body_kind }
  - select: { id: body_kind, index: 5 }
  - wait_for: { id: add_field }
  - tap: { id: add_field }
  - wait_for: { id: "form_name:1" }
  - input: { id: "form_name:1", text: "title" }
  - input: { id: "form_value:1", text: "Hello" }
  - wait_idle: {}
  - screenshot: body-multipart
  - select: { id: body_kind, index: 6 }
  - wait_for: { id: graphql_query }
  - input: { id: graphql_query, text: "query { viewer { login } }" }
  - wait_idle: {}
  - screenshot: body-graphql

  # Authentication this client applies itself: Basic, Bearer and an API key.
  - select: { id: request_tab, index: 3 }
  - wait_for: { id: auth_kind }
  - select: { id: auth_kind, index: 3 }
  - wait_for: { id: auth_token }
  - assert_text: { id: auth_prefix, text: "Bearer" }
  - input: { id: auth_token, text: "${[ token ]}" }
  - toggle: { id: auth_show, value: true }
  - wait_idle: {}
  - screenshot: auth-bearer
  - select: { id: auth_kind, index: 4 }
  - wait_for: { id: auth_location }
  - screenshot: auth-api-key
  - select: { id: auth_kind, index: 3 }
  - wait_idle: {}

  # What the request overrides of its folder's and workspace's send settings.
  - select: { id: request_tab, index: 4 }
  - wait_for: { id: set_redirects }
  - select: { id: set_redirects, index: 2 }
  - input: { id: set_timeout, text: "5000" }
  - wait_idle: {}
  - screenshot: request-settings
  - select: { id: request_tab, index: 0 }
  - wait_idle: {}

  # The layout button stacks the response under the request and back. Only the wide editor
  # has the split; on a phone the button is there but the picker's one-pane layout stays.
  - toolbar: { item: tb_layout }
  - wait_idle: {}
  - screenshot: stacked
  - toolbar: { item: tb_layout }
  - wait_idle: {}

  # The same host re-presented at a phone's width: the editor is a pushed layer with a
  # request/response picker.
  - size_class: { width: compact }
  - wait_idle: {}
  - screenshot: compact
  # At that width a header's name and value take a line each.
  - select: { id: request_tab, index: 2 }
  - wait_for: { id: add_header }
  - screenshot: compact-headers
  - select: { id: request_tab, index: 0 }
  - wait_idle: {}
  - size_class: { width: auto }
  - wait_idle: {}

  # Settings (https://daybrite.dev/docs/reference/settings): the window the App menu opens on a desktop,
  # where a group's own id routes to its tab; the nav's Settings row on a phone, where
  # `settings/<group>` pushes the group's page. The Data group says which store this client
  # opened and where it lives.
  - navigate: { route: general, skip_on: [uikit, material, arkui, dom] }
  - navigate: { route: settings/general, only_on: [uikit, material, arkui, dom] }
  - wait_for: { id: language_picker }
  - screenshot: { name: settings, window: day.preferences, skip_on: [uikit, material, arkui, dom] }
  - screenshot: { name: settings, only_on: [uikit, material, arkui, dom] }
  - navigate: { route: data, skip_on: [uikit, material, arkui, dom] }
  - navigate: { route: settings/data, only_on: [uikit, material, arkui, dom] }
  - wait_for: { id: data_dir }
  - screenshot: { name: settings-data, window: day.preferences, skip_on: [uikit, material, arkui, dom] }
  - screenshot: { name: settings-data, only_on: [uikit, material, arkui, dom] }
  - close_window: { window: day.preferences, skip_on: [uikit, material, arkui, dom] }
